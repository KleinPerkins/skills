name: conformance

# Hermetic conformance + type-evolution regression for the local-jobs framework.
# The harness sandboxes all state and sets LOCAL_JOBS_LAUNCHD_DISABLE=1, so it
# never needs macOS/launchctl and runs on Linux runners.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Git identity for sandbox repos
        run: |
          git config --global user.email "ci@local-jobs.test"
          git config --global user.name "local-jobs ci"

      - name: Hermetic conformance + regression (full)
        run: bash bin/test-local-jobs.sh full
